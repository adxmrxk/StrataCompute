# =============================================================================
#  Scheduled regression benchmark — runs the Phase 5 pipeline nightly and
#  refreshes the reports on the shared PVC (latency drift watch).
#
#  `phase5` only (not `all`): keep scheduled runs fast and deterministic;
#  Cachegrind is heavy and on-demand via the Job. concurrencyPolicy: Forbid
#  guarantees it never overlaps itself or contends the RWO reports volume.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stratacompute-nightly
  namespace: stratacompute
  labels:
    app.kubernetes.io/name: stratacompute
    app.kubernetes.io/component: benchmark
spec:
  schedule: "0 3 * * *"            # 03:00 daily (cluster timezone)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stratacompute
        spec:
          restartPolicy: Never
          containers:
            - name: stratacompute
              image: stratacompute:latest
              imagePullPolicy: IfNotPresent
              args: ["phase5"]
              resources:
                requests:
                  cpu: "2"
                  memory: "2Gi"
                limits:
                  cpu: "2"
                  memory: "2Gi"
              volumeMounts:
                - name: reports
                  mountPath: /app/out
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: stratacompute-reports
